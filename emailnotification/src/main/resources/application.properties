spring.application.name=emailnotification
#If it's 0, a random available port is assigned
server.port=0
spring.kafka.consumer.bootstrap-servers=localhost:9092,localhost:9094,localhost:9096

#To specify deserialization class
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer

spring.kafka.consumer.group-id=product-created-events

#which packages are trusted when recieving json messages
spring.kafka.consumer.properties.spring.json.trusted.packages=kafka.repaso.kafka.domain.events
