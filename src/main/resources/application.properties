server.port=0
spring.application.name=kafka

# Puertos configurados en la clausula EXTERNAL de cada broker
spring.kafka.bootstrap-servers=localhost:9092,localhost:9094,localhost:9096

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer

#Configuracion referente al acknowledgement de los brokers cuando se manda un mensaje

#Cuantas confirmaciones requiere el pruducer desde el cluster antes de considerar un mensaje como enviado
#Si es 1, se refiere a que solo el lider va a mandar esa confirmacion, pero no significa que se garantiza la replicacion en las replicas
#Si es all, todas las 'in-sync' replicas van a mandar la confirmacion, eso gaantiza que todas las replicas han recibido y almacenado el mensaje
spring.kafka.producer.acks=all
#Numero de reintentos
spring.kafka.producer.retries=10
#Tiempo entre cada reintento
spring.kafka.producer.properties.retry.backoff.ms=1000


#Configuracion para activar idempotencia y estar seguros de que no hayan mensajes repetidos si falla el acknowledgement la primera vez y se vuelve a mandar el mismo mensaje
spring.kafka.producer.properties.enable.idempotence=true